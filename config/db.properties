# ---------------------------------------------------------------
# Little Horizons ERP - database connection
# Development machine: user root, password 1234.
# If your MySQL uses another password, change db.password below.
# ---------------------------------------------------------------
db.url=jdbc:mysql://localhost:3306/erp_little_horizons?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
db.user=root
db.password=1234

# Folder where invoices (.txt) are written, relative to the project root
app.invoiceDir=invoices
# Error log file
app.logFile=error_log.txt
# Optional: pin the academic year used by default (empty = current calendar year)
app.academicYear=2026
